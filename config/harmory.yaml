harmory:
  click_point:
    x: 580        # TODO: thay bằng tọa độ thực (client area, tính từ góc trên-trái cửa sổ game)
    y: 336
  result_roi:
    x: 310        # TODO
    y: 425
    width: 293    # TODO
    height: 73    # TODO
  # expected_template_path: assets/harmory/expected_result.png   # chỉ cần cho template_match / per_row_pink
  compare_method: per_row_ocr      # per_row_ocr | template_match | color_mask_template_match
  num_stat_rows: 3                 # số dòng stat trong result panel
  expected_stat_texts:             # chạy 'harmory ocr-test --char ...' để lấy text đúng, rồi điền vào đây
    []
  threshold: 0.60                  # 0.33=≥1 dòng, 0.60=≥2 dòng, 1.0=tất cả dòng
  click_delay_ms: 4000             # chờ 4 giây sau click trước khi capture
  max_attempts: null               # null = retry vô hạn cho tới khi match hoặc user stop
  stop_hotkey: F12                 # phím dừng bot (F9-F12, Pause, ScrollLock, Insert, Delete, Escape)
  save_debug_screenshot: true
  # ocr_scale: 4                   # upscale factor trước khi OCR (tăng lên 6 nếu font quá nhỏ)
  # tesseract_cmd: "C:/Program Files/Tesseract-OCR/tesseract.exe"   # nếu tesseract không trong PATH

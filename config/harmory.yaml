harmory:
  # ── Điểm click (client area, tính từ góc trên-trái cửa sổ game) ──────────────
  click_point:
    x: 580    # TODO: thay bằng tọa độ thực
    y: 336

  # ── Vùng capture kết quả ─────────────────────────────────────────────────────
  result_roi:
    x: 310    # TODO
    y: 425    # TODO
    width: 293    # TODO
    height: 73    # TODO

  # ── OCR matching ──────────────────────────────────────────────────────────────
  compare_method: per_row_ocr
  num_stat_rows: 3    # số dòng stat trong ROI — dùng để chia dải OCR (không đổi trừ khi ROI thay đổi)
  # Chạy 'harmory ocr-test --char ...' khi game đang hiện kết quả mong muốn,
  # copy những dòng CẦN match vào expected_stat_texts (có thể ít hơn num_stat_rows):
  # expected_stat_texts:
  #   - "Defense Increase +50 (Max 50)"    # ← thay bằng text OCR đọc được
  #   - "Damage Reduction Increase +50 (Max 50)"
  #   - "SD Ratio Increase +5 (Max 5)"
  expected_stat_texts:
    - "Defense Increase +50 (Max 50)"
    - "Damage Reduction Increase +50 (Max 50)"
    - "SD Ratio Increase +5 (Max 5)"
  threshold: 1.0    # tỉ lệ expected_stat_texts phải match: 1.0=tất cả, 0.5=nửa, v.v.

  # ── Timing & giới hạn ─────────────────────────────────────────────────────────
  click_delay_ms: 4000    # ms chờ sau mỗi click trước khi capture
  max_attempts: null      # null = không giới hạn

  # ── Điều khiển ────────────────────────────────────────────────────────────────
  stop_hotkey: F12        # F9-F12, Pause, ScrollLock, Insert, Delete, Escape
  save_debug_screenshot: true    # lưu ảnh khi match (vào .claude/logs/harmory/)

  # ── Tùy chọn nâng cao ────────────────────────────────────────────────────────
  # ocr_scale: 4          # upscale trước OCR; tăng lên 6 nếu text quá nhỏ
  # tesseract_cmd: "C:/Program Files/Tesseract-OCR/tesseract.exe"    # nếu không trong PATH
